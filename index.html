<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공연연습실 예약</title>
<style>
:root{--bg:#f3f1f7;--card:#fff;--ink:#1d1b26;--mute:#7a7689;--line:#dcd8e6;--acc:#5b3df5;--accInk:#fff;--busy:#e9e6f0;--err:#c0262d}
@media (prefers-color-scheme:dark){:root{--bg:#14121b;--card:#1d1a27;--ink:#f1eff8;--mute:#9b97ad;--line:#322e42;--acc:#8b74ff;--accInk:#14121b;--busy:#2a2637;--err:#ff7b81}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;text-align:left;cursor:pointer;min-height:54px}
.slot b{display:block;font-size:15px}
.slot small{color:var(--mute);font-size:12px}
.slot.busy{background:var(--busy);color:var(--mute)}
.slot.past{opacity:.4;cursor:not-allowed}
.slot.sel{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.slot.sel small{color:var(--accInk)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
button.go,button.sm{font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--acc);color:var(--accInk);cursor:pointer}
button.go{width:100%;font-size:17px;margin-top:14px;padding:15px}
button.sm{padding:10px 14px;font-size:14px;margin-top:10px;margin-right:6px}
button.ghost{background:none;color:var(--mute);border:0;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:8px 0}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{margin:10px 0 0;font-size:14px;min-height:20px}
.err{color:var(--err)}
#adm{display:none}
.row{display:flex;gap:8px}.row>div{flex:1}
.log p{font-size:13px;margin:4px 0;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>공연연습실</h1>
  <p class="sub" id="dateLine">불러오는 중…</p>

  <div class="card"><div class="grid" id="grid"></div></div>

  <div class="card">
    <p id="sum" style="margin:0">시간을 눌러 선택하세요.</p>
    <label for="team">팀 이름 (1~12자)</label>
    <input id="team" maxlength="12" autocomplete="off">
    <button class="go" id="go" disabled>예약하기</button>
    <p id="msg" role="status"></p>
  </div>

  <button class="ghost" id="admBtn">관리자</button>
  <div class="card" id="adm">
    <label for="pw">관리자 비밀번호</label>
    <input id="pw" type="password" autocomplete="off">
    <button class="sm" id="pwGo">로그인</button>
    <div id="admBody" style="display:none">
      <p style="font-size:13px;color:var(--mute)">예약된 칸을 누르면 삭제돼요.</p>
      <div class="row">
        <div><label for="cOpen">오픈 시각</label><input id="cOpen" type="time"></div>
        <div><label for="cMax">팀당 최대 칸</label><input id="cMax" type="number" min="1" max="48"></div>
      </div>
      <label for="cDay">대상 날짜 (비우면 오늘)</label>
      <input id="cDay" type="date">
      <button class="sm" id="cSave">설정 저장</button>
      <button class="sm" id="lgShow">삭제 기록</button>
      <button class="sm" id="lgClear">기록 비우기</button>
      <div class="log" id="logs"></div>
      <p id="admMsg" style="font-size:14px;margin:8px 0 0"></p>
    </div>
  </div>
</main>

<script>
const URL_ = "https://ozcbiorhiddkztzwsqti.supabase.co";
const KEY = "sb_publishable_j7i12J04Mw_Q05GKSePEHw_90aM7tUv";
const $ = id => document.getElementById(id);
// 00:00~02:00 (슬롯 0~3) + 06:00~24:00 (슬롯 12~47)
const SLOTS = [0,1,2,3]; for(let i=12;i<48;i++) SLOTS.push(i);
const ERR = {BAD_NAME:"팀 이름은 1~12자로 입력해 주세요.",BAD_REQUEST:"요청이 올바르지 않아요.",NOT_OPEN:"아직 예약이 열리지 않았어요.",PAST:"이미 지난 시간이 포함돼 있어요.",OVER_LIMIT:"팀당 예약 가능한 칸 수를 넘었어요.",TAKEN:"방금 다른 팀이 먼저 예약했어요. 다시 골라 주세요.",NOT_ADMIN:"비밀번호가 맞지 않아요."};
let st = null, books = [], sel = new Set(), admin = false;

const t = s => { const m = s*30; return String(Math.floor(m/60)).padStart(2,"0")+":"+(m%60?"30":"00"); };
const headers = {apikey:KEY,"Content-Type":"application/json"};

async function rpc(fn, body){
  const r = await fetch(URL_+"/rest/v1/rpc/"+fn,{method:"POST",headers,body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j && j.message) || "ERR");
  return j;
}
const msgOf = e => ERR[e.message] || "문제가 생겼어요. 잠시 후 다시 시도해 주세요.";
const bookAt = s => books.find(b => b.slot === s);
const isPast = s => st.day === st.today && s*30+30 <= st.now_min;
const notOpen = () => st.day === st.today && st.now_min < (+st.open.slice(0,2))*60 + (+st.open.slice(3));

async function load(){
  try{
    st = await rpc("get_state");
    const r = await fetch(URL_+"/rest/v1/bookings?select=id,slot,team_name&day=eq."+st.day+"&order=slot",{headers});
    books = await r.json();
    for(const s of [...sel]) if(bookAt(s)||isPast(s)) sel.delete(s);
    render();
  }catch(e){ $("dateLine").textContent="불러오지 못했어요. 새로고침해 주세요."; console.error(e); }
}

function render(){
  const [,m,d] = st.day.split("-");
  $("dateLine").textContent = `${+m}월 ${+d}일 · 팀당 최대 ${st.max}칸(30분) · 오픈 ${st.open}`;
  const g = $("grid"); g.innerHTML = "";
  SLOTS.forEach(s=>{
    const b = bookAt(s), past = isPast(s), el = document.createElement("button");
    el.type="button";
    el.className = "slot"+(b?" busy":past?" past":"")+(sel.has(s)?" sel":"");
    el.disabled = !admin && (!!b || past);
    el.innerHTML = `<b>${t(s)}~${t(s+1)}</b><small>${b?b.team_name:(s<4?"새벽":"")}</small>`;
    el.onclick = () => onSlot(s,b);
    g.appendChild(el);
  });
  $("sum").textContent = notOpen() ? `${st.open}부터 예약할 수 있어요.` : sel.size ? `${sel.size}칸 선택됨 (${sel.size*30}분)` : "시간을 눌러 선택하세요.";
  $("go").disabled = !sel.size || notOpen();
}

async function onSlot(s,b){
  if(admin && b){
    if(!confirm(`${t(s)} ${b.team_name} 예약을 삭제할까요?`)) return;
    try{ await rpc("admin_delete_booking",{p_pw:$("pw").value,p_id:b.id}); }catch(e){ $("admMsg").textContent=msgOf(e); }
    return load();
  }
  if(b||isPast(s)) return;
  sel.has(s) ? sel.delete(s) : sel.add(s);
  setMsg(""); render();
}
function setMsg(x,err){ const m=$("msg"); m.textContent=x; m.className=err?"err":""; }

$("go").onclick = async ()=>{
  $("go").disabled = true;
  try{
    await rpc("book",{p_team:$("team").value,p_slots:[...sel]});
    sel.clear(); setMsg("예약됐어요!");
  }catch(e){ setMsg(msgOf(e),true); }
  load();
};

// 관리자
$("admBtn").onclick = ()=>{ const a=$("adm"); a.style.display = a.style.display==="block"?"none":"block"; };
$("pwGo").onclick = async ()=>{
  try{
    if(await rpc("admin_check",{p_pw:$("pw").value})){
      admin = true; $("admBody").style.display="block";
      $("cOpen").value=st.open; $("cMax").value=st.max; $("cDay").value=st.target||"";
      $("admMsg").textContent="로그인됐어요."; render();
    } else $("admMsg").textContent = ERR.NOT_ADMIN;
  }catch(e){ $("admMsg").textContent = msgOf(e); }
};
$("cSave").onclick = async ()=>{
  try{
    await rpc("admin_set_config",{p_pw:$("pw").value,p_open:$("cOpen").value,p_max:+$("cMax").value,p_day:$("cDay").value||null});
    $("admMsg").textContent="저장했어요."; load();
  }catch(e){ $("admMsg").textContent = msgOf(e); }
};
$("lgShow").onclick = async ()=>{
  try{
    const L = await rpc("admin_logs",{p_pw:$("pw").value});
    $("logs").innerHTML = L.length ? "" : "<p>기록이 없어요.</p>";
    L.forEach(l=>{ const p=document.createElement("p"); p.textContent=`${new Date(l.at).toLocaleString("ko-KR")} · ${l.day} ${t(l.slot)} · ${l.team}`; $("logs").appendChild(p); });
  }catch(e){ $("admMsg").textContent = msgOf(e); }
};
$("lgClear").onclick = async ()=>{
  if(!confirm("삭제 기록을 모두 지울까요?")) return;
  try{ await rpc("admin_clear_logs",{p_pw:$("pw").value}); $("logs").innerHTML=""; }catch(e){ $("admMsg").textContent = msgOf(e); }
};

load(); setInterval(load,15000);
</script>
</body>
</html>
